<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>資材在庫 | TOKYO WASABI</title>
<meta name="description" content="わさび食堂の資材在庫管理">
<meta name="theme-color" content="#3a5a40">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="資材在庫">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Google のサーバーへの接続を先に用意しておく（初回の待ち時間が減る） -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>

<link rel="stylesheet" href="style.css">

<!-- 画面を組み立てるより先に読み込みを始めたいので、common.js だけは <head> に置く -->
<script src="common.js"></script>
</head>
<body>

<header class="app-head" id="head">
  <div class="head-top">
    <h1>資材在庫<span class="head-sub">TOKYO WASABI</span></h1>
    <button type="button" class="icon-btn" id="reload" aria-label="最新の状態に読み込み直す"></button>
  </div>
  <div class="loc-bar" id="locbar"></div>

  <div class="stale-bar" id="stalebar" hidden>
    <div class="stale-inner">
      <span class="spinner" id="stalespin"></span>
      <span id="stalemsg"></span>
      <button type="button" id="staleretry" hidden>再読み込み</button>
    </div>
  </div>
</header>

<main id="list"></main>

<nav class="tabbar" id="tabbar" role="tablist" aria-label="表示の切り替え"></nav>

<script src="app.js"></script>
</body>
</html>
